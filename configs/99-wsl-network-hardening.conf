# WSL network hardening — safe TCP tuning for WSL2 Mirrored Mode
#
# CRITICAL WARNING FOR WSL2 MIRRORED MODE:
# Do NOT set net.ipv4.ip_local_port_range here!
# In mirrored mode, Windows FSE Switch assigns WSL a dynamic 4096-port ephemeral
# range per boot (see `nft list chain ip nat WSLPOSTROUTING`). Overriding it
# causes outbound TCP/UDP source ports outside the FSE window to be silently dropped.
#
# net.ipv4.ip_local_port_range = 10000 65535

# Increase TCP connection capacity
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_tw_reuse = 1

# Faster connection cleanup
net.ipv4.tcp_fin_timeout = 15

# SYN flood protection
net.ipv4.tcp_syncookies = 1

# Increase socket buffer sizes for concurrent connections
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
